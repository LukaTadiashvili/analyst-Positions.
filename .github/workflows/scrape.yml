name: ვაკანსიების შემოწმება

on:
  schedule:
    # GitHub-ის დაგეგმილი გაშვება ზოგჯერ გამოტოვებულია, ამიტომ 3 სარეზერვო დრო გვაქვს.
    # შეტყობინება მხოლოდ ახალ ვაკანსიაზე მოდის, ასე რომ, განმეორებით შემოწმება ზედმეტ მესიჯს არ გამოიწვევს.
    - cron: "17 4 * * *"   # 08:17 თბილისი
    - cron: "41 7 * * *"   # 11:41 თბილისი
    - cron: "23 13 * * *"  # 17:23 თბილისი
  workflow_dispatch:        # აპის "განახლების" ღილაკი / ხელით გაშვება
    inputs:
      test_notify:
        description: "ტესტური შეტყობინების გაგზავნა ntfy-ზე"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: საიტების შემოწმება
        if: github.event_name != 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.test_notify && '1' || '' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scraper/scrape.py

      - name: მონაცემების შენახვა
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data scraper/cache.json
          git diff --cached --quiet || git commit -m "მონაცემები: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
